name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: compile all scripts
        run: python -m py_compile scripts/*.py
      - name: lint registry + manifest
        run: python scripts/lint_registry.py
      - name: architecture contracts
        run: python scripts/check_contracts.py
      - name: lint + contracts on the CI fixture (runnable once tracked data leaves git)
        run: |
          python tests/ci_fixture.py "$RUNNER_TEMP/ci-dataset"
          python scripts/lint_registry.py --root "$RUNNER_TEMP/ci-dataset"
          python scripts/check_contracts.py --root "$RUNNER_TEMP/ci-dataset"
      - name: golden tests (quality gate + registry I/O)
        run: pytest tests/ -q
